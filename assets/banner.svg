<text x="677" y="137" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-size="12" xml:space="preserve" opacity="0"><tspan fill="#A8A196">  name  = </tspan><tspan fill="#F5F0E6">"Rea"</tspan><tspan fill="#A8A196">;</tspan><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.3s" fill="freeze"/></text>
<text x="677" y="160" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-size="12" xml:space="preserve" opacity="0"><tspan fill="#A8A196">  stack = </tspan><tspan fill="#F5F0E6">["C#", "Java", "JS"]</tspan><tspan fill="#A8A196">;</tspan><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.6s" fill="freeze"/></text>
<text x="677" y="183" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-size="12" xml:space="preserve" opacity="0"><tspan fill="#A8A196">  focus = </tspan><tspan fill="#F5F0E6">["Web", "Mobile", "Data"]</tspan><tspan fill="#A8A196">;</tspan><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.9s" fill="freeze"/></text>
<text x="677" y="206" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-size="12" xml:space="preserve" opacity="0"><tspan fill="#A8A196">  build() {</tspan><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2.2s" fill="freeze"/></text>
<text x="677" y="229" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-size="12" xml:space="preserve" opacity="0"><tspan fill="#C9B99A">    return </tspan><tspan fill="#F5F0E6">quality</tspan><tspan fill="#A8A196">;</tspan><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2.5s" fill="freeze"/></text>
<text x="677" y="252" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-size="12" xml:space="preserve" opacity="0"><tspan fill="#A8A196">  }</tspan><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2.8s" fill="freeze"/></text>
<text x="677" y="275" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-size="12" xml:space="preserve" opacity="0"><tspan fill="#A8A196">}</tspan><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="3.1s" fill="freeze"/></text>
