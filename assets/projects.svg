<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 625" width="1000" height="625" role="img" aria-label="Projects"><style>
text{font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif}
.m{font-family:'SFMono-Regular', Consolas, 'Courier New', monospace}
.chip{opacity:0;animation:pop .5s ease forwards}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style><g transform="translate(10,10)"><rect width="980" height="248" rx="18" fill="#262626" stroke="#4A4A4A"/><text class="m" x="30" y="38" font-size="13" letter-spacing="2" fill="#C9B99A">// FEATURED · TEAM PROJECT</text><text x="30" y="84" font-size="36" font-weight="700" fill="#F5F0E6">Amplify</text><text x="30" y="118" font-size="14.5" fill="#D9D2C3">A collaborative platform built with my team to connect students and the younger generation with</text><text x="30" y="140" font-size="14.5" fill="#D9D2C3">real businesses. Users get help understanding the learning material through a built-in AI</text><text x="30" y="162" font-size="14.5" fill="#D9D2C3">assistant, can chat with other users, and once verified can post and interact with the community.</text><g class="chip" style="animation-delay:0.20s"><rect x="30.0" y="190" width="181.4" height="30" rx="15" fill="#3A3A3A"/><text x="120.7" y="209.5" text-anchor="middle" font-size="13" font-weight="600" fill="#F5F0E6">Built-in AI assistant</text></g><g class="chip" style="animation-delay:0.27s"><rect x="221.4" y="190" width="129.6" height="30" rx="15" fill="#3A3A3A"/><text x="286.2" y="209.5" text-anchor="middle" font-size="13" font-weight="600" fill="#F5F0E6">Community chat</text></g><g class="chip" style="animation-delay:0.34s"><rect x="361.0" y="190" width="144.4" height="30" rx="15" fill="#3A3A3A"/><text x="433.2" y="209.5" text-anchor="middle" font-size="13" font-weight="600" fill="#F5F0E6">Verified posting</text></g><g class="chip" style="animation-delay:0.41s"><rect x="515.4" y="190" width="114.8" height="30" rx="15" fill="#3A3A3A"/><text x="572.8" y="209.5" text-anchor="middle" font-size="13" font-weight="600" fill="#F5F0E6">Team project</text></g><circle cx="835" cy="124" r="20" fill="none" stroke="#C9B99A" stroke-width="2"><animate attributeName="r" values="20;80" dur="3s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;0" dur="3s" begin="0s" repeatCount="indefinite"/></circle><circle cx="835" cy="124" r="20" fill="none" stroke="#C9B99A" stroke-width="2"><animate attributeName="r" values="20;80" dur="3s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;0" dur="3s" begin="1s" repeatCount="indefinite"/></circle><circle cx="835" cy="124" r="20" fill="none" stroke="#C9B99A" stroke-width="2"><animate attributeName="r" values="20;80" dur="3s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;0" dur="3s" begin="2s" repeatCount="indefinite"/></circle><circle cx="835" cy="124" r="8" fill="#C9B99A"/><text class="m" x="835" y="224" text-anchor="middle" font-size="12" fill="#A8A196">github.com/ReaMolakeng/Amplify</text></g><text class="m" x="10" y="290" font-size="13" letter-spacing="2" fill="#6B6B6B">// MORE WORK</text><g transform="translate(10.0,308)"><rect width="313.3" height="307" rx="16" fill="#F5F0E6" stroke="#D9D2C3"/><text class="m" x="20" y="32" font-size="12" letter-spacing="2" fill="#6B6B6B">// ACADEMIC PROJECT</text><text x="20" y="62" font-size="17" font-weight="700" fill="#262626">Database Management System</text><text x="20" y="92" font-size="13.5" fill="#6B6B6B">Designed a relational database from</text><text x="20" y="113" font-size="13.5" fill="#6B6B6B">an ERD for cultural venues, room</text><text x="20" y="134" font-size="13.5" fill="#6B6B6B">types, municipal demographics and</text><text x="20" y="155" font-size="13.5" fill="#6B6B6B">scheduled activities. Built tables</text><text x="20" y="176" font-size="13.5" fill="#6B6B6B">and keys, managed records, and</text><text x="20" y="197" font-size="13.5" fill="#6B6B6B">explored the data with SQL queries</text><text x="20" y="218" font-size="13.5" fill="#6B6B6B">and stored procedures.</text><g class="chip" style="animation-delay:0.30s"><rect x="20.0" y="255" width="48.2" height="30" rx="15" fill="#262626"/><text x="44.1" y="274.5" text-anchor="middle" font-size="13" font-weight="600" fill="#F5F0E6">SQL</text></g><g class="chip" style="animation-delay:0.37s"><rect x="78.2" y="255" width="48.2" height="30" rx="15" fill="#262626"/><text x="102.3" y="274.5" text-anchor="middle" font-size="13" font-weight="600" fill="#F5F0E6">ERD</text></g><g class="chip" style="animation-delay:0.44s"><rect x="136.4" y="255" width="100.0" height="30" rx="15" fill="#262626"/><text x="186.4" y="274.5" text-anchor="middle" font-size="13" font-weight="600" fill="#F5F0E6">Procedures</text></g></g><g transform="translate(343.3,308)"><rect width="313.3" height="307" rx="16" fill="#F5F0E6" stroke="#D9D2C3"/><text class="m" x="20" y="32" font-size="12" letter-spacing="2" fill="#6B6B6B">// ACADEMIC PROJECT</text><text x="20" y="62" font-size="17" font-weight="700" fill="#262626">E-commerce Android App</text><text x="20" y="92" font-size="13.5" fill="#6B6B6B">An Android shopping app concept for</text><text x="20" y="113" font-size="13.5" fill="#6B6B6B">SmartGadgets. Customers browse</text><text x="20" y="134" font-size="13.5" fill="#6B6B6B">smartphones, review product details</text><text x="20" y="155" font-size="13.5" fill="#6B6B6B">and manage a cart with totals that</text><text x="20" y="176" font-size="13.5" fill="#6B6B6B">update as quantities change.</text><g class="chip" style="animation-delay:0.60s"><rect x="20.0" y="255" width="77.8" height="30" rx="15" fill="#262626"/><text x="58.9" y="274.5" text-anchor="middle" font-size="13" font-weight="600" fill="#F5F0E6">Android</text></g><g class="chip" style="animation-delay:0.67s"><rect x="107.8" y="255" width="70.4" height="30" rx="15" fill="#262626"/><text x="143.0" y="274.5" text-anchor="middle" font-size="13" font-weight="600" fill="#F5F0E6">Mobile</text></g><g class="chip" style="animation-delay:0.74s"><rect x="188.2" y="255" width="40.8" height="30" rx="15" fill="#262626"/><text x="208.6" y="274.5" text-anchor="middle" font-size="13" font-weight="600" fill="#F5F0E6">UX</text></g></g><g transform="translate(676.7,308)"><rect width="313.3" height="307" rx="16" fill="#F5F0E6" stroke="#D9D2C3"/><text class="m" x="20" y="32" font-size="12" letter-spacing="2" fill="#6B6B6B">// ACADEMIC PROJECT</text><text x="20" y="62" font-size="17" font-weight="700" fill="#262626">E-Book Hub</text><text x="20" y="92" font-size="13.5" fill="#6B6B6B">A reader-friendly book discovery page</text><text x="20" y="113" font-size="13.5" fill="#6B6B6B">built with HTML and CSS, focused on</text><text x="20" y="134" font-size="13.5" fill="#6B6B6B">clear navigation, readable content</text><text x="20" y="155" font-size="13.5" fill="#6B6B6B">and an approachable layout.</text><g class="chip" style="animation-delay:0.90s"><rect x="20.0" y="255" width="55.6" height="30" rx="15" fill="#262626"/><text x="47.8" y="274.5" text-anchor="middle" font-size="13" font-weight="600" fill="#F5F0E6">HTML</text></g><g class="chip" style="animation-delay:0.97s"><rect x="85.6" y="255" width="48.2" height="30" rx="15" fill="#262626"/><text x="109.7" y="274.5" text-anchor="middle" font-size="13" font-weight="600" fill="#F5F0E6">CSS</text></g><g class="chip" style="animation-delay:1.04s"><rect x="143.8" y="255" width="48.2" height="30" rx="15" fill="#262626"/><text x="167.9" y="274.5" text-anchor="middle" font-size="13" font-weight="600" fill="#F5F0E6">Web</text></g></g></svg>
